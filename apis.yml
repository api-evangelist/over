aid: over
name: Over
description: >-
  Overworld is an open-science AI research lab building interactive world models -
  AI-generated video environments that respond in real time to text prompts and
  controller input at game-level framerates. Its open-source World Engine is a Python
  inference library that loads Waypoint world models and LoRA adapters from HuggingFace
  to generate playable, promptable worlds locally or in the browser. Founded by Louis
  Castricato (CEO) and Shahbuland Matiana (Head of Mathematical Research), both formerly
  of CarperAI and Stability AI, the team operates openly and publishes its infrastructure
  as public open-source repositories. Overworld does not currently expose a hosted REST
  API; its primary developer artifact is the first-party world_engine Python SDK.
